<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Exciting Expeditions</title>
    <meta name="description" content="Contact Exciting Expeditions for whitewater rafting reservations, general inquiries, website suggestions, and river trip details.">
    <meta name="author" content="Dorathy Osakwe">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Exciting Expeditions Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-header">
            <h1>Exciting Expeditions</h1>
            <p>450 River Canyon Road</p>
            <p>Rapid City, ID 83440</p>
            <p>+1 (208) 555-0194</p>
            <p>info@excitingexpeditions.com</p>
        </section>

        <section class="map-form-grid">
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2879.0000000000005!2d-111.789687684497!3d43.8231099791158!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53540b03dc48a5cf%3A0x1e5534d3c38ef412!2sBrigham%20Young%20University-Idaho!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Exciting Expeditions Location Map"></iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="inline-field">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Your Full Name" required>
                </div>

                <div class="inline-field">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="you@example.com" required>
                </div>

                <fieldset class="inline-field purpose-fieldset">
                    <legend>Message Purpose</legend>
                    <div class="radio-stack">
                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general" required>
                            General Inquiry
                        </label>
                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </fieldset>

                <div class="stacked-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <div class="newsletter-check">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>

        <section class="employees-box">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Sarah Jenkins, Lead River Guide">
                    <figcaption>Sarah Jenkins - Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Marcus Vance, Reservations Manager">
                    <figcaption>Marcus Vance - Reservations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Carlos Mendoza, Safety Coordinator">
                    <figcaption>Carlos Mendoza - Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Exciting Expeditions | Dorathy Osakwe</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
                <img src="images/twitter.png" alt="Twitter">
            </a>
        </nav>
    </footer>
</body>

</html>
